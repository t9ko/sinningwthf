<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>sinning</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- custom cursor -->
  <div id="cur-dot" class="gone" aria-hidden="true"></div>
  <div id="cur-ring" class="gone" aria-hidden="true"><i></i></div>

  <div id="net" class="hidden">Reconnecting</div>

  <!-- login / create account -->
  <section id="auth" class="hidden">
    <div class="grid-bg" aria-hidden="true"></div>
    <form id="auth-form" autocomplete="on">
      <h1 class="brand">sinning<span>.</span></h1>
      <div class="tabs">
        <button type="button" class="tab active" data-mode="login">Log in</button>
        <button type="button" class="tab" data-mode="register">Create account</button>
      </div>
      <label class="field">
        <span>Username</span>
        <input id="auth-user" name="username" maxlength="20" autocomplete="username" autocapitalize="off" spellcheck="false" required>
      </label>
      <label class="field">
        <span>Password</span>
        <input id="auth-pass" name="password" type="password" maxlength="200" autocomplete="current-password" required>
      </label>
      <p id="auth-error" class="error" role="alert"></p>
      <button class="btn solid wide" id="auth-submit" type="submit">Enter</button>
    </form>
  </section>

  <!-- main app -->
  <section id="app" class="hidden">
    <aside id="side">
      <header class="me">
        <button id="me-avatar" class="avatar-btn" type="button" title="Change profile picture"></button>
        <div class="me-info">
          <div id="me-name" class="name"></div>
          <div class="sub">Click picture to change</div>
        </div>
        <button id="open-settings" class="btn small" type="button">Settings</button>
      </header>

      <form id="add-form">
        <input id="add-input" placeholder="Add friend by username" maxlength="21" autocapitalize="off" spellcheck="false" autocomplete="off">
        <button class="btn small" type="submit">Add</button>
      </form>
      <p id="add-msg" class="note"></p>

      <div class="label">Friends</div>
      <div id="friends"></div>
    </aside>

    <main id="chat">
      <div id="empty">
        <div class="brand big">sinning<span>.</span></div>
        <p>Add a friend by username and start talking.</p>
      </div>

      <div id="convo" class="hidden">
        <header class="convo-head">
          <button id="back" class="btn small" type="button">Back</button>
          <div id="peer-avatar"></div>
          <div class="peer-info">
            <div id="peer-name" class="name"></div>
            <div id="peer-status" class="sub"></div>
          </div>
          <button id="clear-chat" class="btn small" type="button">Delete chat</button>
          <button id="remove-friend" class="btn small" type="button">Unfriend</button>
        </header>

        <div class="msgs-wrap">
          <div id="msgs"></div>
          <button id="jump" class="btn small solid hidden" type="button">New messages</button>
          <div id="drop">Drop image to send</div>
        </div>
        <div id="typing"></div>

        <div id="gif-panel" class="panel hidden">
          <div class="gif-top">
            <input id="gif-search" placeholder="Search GIPHY" autocomplete="off">
            <button id="gif-close" class="btn small" type="button">Close</button>
          </div>
          <div id="gif-grid"></div>
          <div class="gif-credit">Powered by GIPHY</div>
        </div>

        <div id="emoji-panel" class="panel hidden"><div id="emoji-grid"></div></div>

        <div id="ctx" class="hidden">
          <div class="ctx-text"><b id="ctx-title"></b><span id="ctx-body"></span></div>
          <button id="ctx-x" class="btn small" type="button">Cancel</button>
        </div>

        <form id="composer">
          <button id="btn-img" class="btn small" type="button" title="Send an image">Img</button>
          <button id="btn-gif" class="btn small" type="button" title="Send a GIF">Gif</button>
          <button id="btn-emo" class="btn small" type="button" title="Emoji">Emoji</button>
          <button id="btn-mic" class="btn small" type="button" title="Record a voice message">Mic</button>
          <textarea id="text" rows="1" placeholder="Message" maxlength="4000" autocomplete="off"></textarea>
          <div id="rec">
            <span class="rec-dot"></span>
            <span id="rec-time">0:00</span>
            <span class="rec-label">Recording</span>
          </div>
          <button id="rec-cancel" class="btn small" type="button">Cancel</button>
          <button id="send" class="btn small solid" type="submit">Send</button>
        </form>
      </div>
    </main>
  </section>

  <input id="file-img" class="hidden" type="file" accept="image/png,image/jpeg,image/gif,image/webp">
  <input id="file-avatar" class="hidden" type="file" accept="image/png,image/jpeg,image/gif,image/webp">

  <div id="lightbox" class="overlay hidden"><img alt=""></div>

  <div id="settings" class="overlay hidden">
    <div class="modal-box">
      <h2>Settings</h2>
      <div class="set-row"><span>Message sound</span><button id="set-sound" class="btn small" type="button"></button></div>
      <div class="set-row"><span>Desktop notifications</span><button id="set-notify" class="btn small" type="button"></button></div>
      <form id="pw-form">
        <div class="label">Change password</div>
        <input id="pw-current" type="password" placeholder="Current password" autocomplete="current-password" required>
        <input id="pw-next" type="password" placeholder="New password" autocomplete="new-password" required>
        <p id="pw-msg" class="note"></p>
        <button class="btn small" type="submit">Change password</button>
      </form>
      <div class="modal-actions">
        <button id="logout" class="btn small" type="button">Log out</button>
        <button id="set-close" class="btn small solid" type="button">Done</button>
      </div>
    </div>
  </div>

  <div id="modal" class="overlay hidden">
    <div class="modal-box">
      <p id="modal-text"></p>
      <div class="modal-actions">
        <button id="modal-no" class="btn small" type="button">Cancel</button>
        <button id="modal-yes" class="btn small solid" type="button">Confirm</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="/app.js"></script>
</body>
</html>
